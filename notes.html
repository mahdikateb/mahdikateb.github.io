<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یادداشت‌های حقوقی | محمدمهدی کاتب دامغانی</title>
<meta name="description" content="یادداشت‌ها و نکته‌های حقوقی درباره مالکیت فکری، قراردادها و حقوق فناوری — محمدمهدی کاتب دامغانی">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--ink:#22303E;--ink-soft:#5C6B7A;--soft:#F7F8FA;--border:#E4E7EB;--navy:#1F3A5F;--navy-deep:#16283F;--gold:#B08D42;--gold-soft:#F6F0E3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;color:var(--ink);background:#fff;font-size:16px;line-height:1.9}
a{color:inherit;text-decoration:none}
.container{max-width:820px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-weight:700;font-size:16px;color:var(--navy)}
.brand span{color:var(--gold)}
.back{border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--navy)}
.back:hover{border-color:var(--navy)}
.page-head{background:linear-gradient(180deg,var(--soft) 0%,#fff 100%);border-bottom:1px solid var(--border);padding:48px 0}
.page-head .eyebrow{color:var(--gold);font-weight:700;font-size:14px;margin-bottom:6px}
.page-head h1{font-size:30px;color:var(--navy-deep);font-weight:800}
.page-head p{color:var(--ink-soft);font-size:15.5px;margin-top:8px}
main{padding:48px 0 72px}
.note-card{display:block;background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px 26px;margin-bottom:18px;transition:box-shadow .15s}
.note-card:hover{box-shadow:0 8px 24px rgba(22,40,63,.08);border-color:#d3d9e0}
.note-card .date{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:4px}
.note-card h2{font-size:18.5px;color:var(--navy-deep);margin-bottom:8px}
.note-card p{font-size:14.5px;color:var(--ink-soft)}
.note-card .more{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--gold)}
.empty{text-align:center;color:var(--ink-soft);padding:56px 0;font-size:15px}
footer{border-top:1px solid var(--border);padding:26px 0;color:var(--ink-soft);font-size:14px}
.footer-inner{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="container nav">
    <div class="brand">محمدمهدی کاتب دامغانی<span> | یادداشت‌های حقوقی</span></div>
    <a class="back" href="index.html">← بازگشت به صفحه اصلی</a>
  </div>
</header>
<div class="page-head">
  <div class="container">
    <div class="eyebrow">وبلاگ</div>
    <h1>یادداشت‌های حقوقی</h1>
    <p>نکته‌ها و تحلیل‌های کاربردی درباره مالکیت فکری، قراردادها و حقوق فناوری</p>
  </div>
</div>
<main>
  <div class="container" id="list"><div class="empty">در حال بارگذاری یادداشت‌ها...</div></div>
</main>
<footer>
  <div class="container footer-inner">
    <div>© ۱۴۰۵ محمدمهدی کاتب دامغانی — کلیه حقوق محفوظ است.</div>
    <div>mahdikateb.ir</div>
  </div>
</footer>
<script>
fetch('posts.json?v='+Date.now()).then(function(r){return r.json()}).then(function(j){
  var list=document.getElementById('list');
  var posts=(j&&j.posts)||[];
  if(!posts.length){list.innerHTML='<div class="empty">هنوز یادداشتی منتشر نشده است.</div>';return}
  list.innerHTML='';
  posts.slice().reverse().forEach(function(p){
    var a=document.createElement('a');a.className='note-card';a.href='note.html?id='+encodeURIComponent(p.id);
    var d=document.createElement('div');d.className='date';d.textContent=p.date||'';a.appendChild(d);
    var h=document.createElement('h2');h.textContent=p.title||'';a.appendChild(h);
    var ex=document.createElement('p');var t=(p.body||'').replace(/\n+/g,' ');ex.textContent=t.length>160?t.slice(0,160)+'…':t;a.appendChild(ex);
    var m=document.createElement('span');m.className='more';m.textContent='ادامه مطلب';a.appendChild(m);
    list.appendChild(a);
  });
}).catch(function(){document.getElementById('list').innerHTML='<div class="empty">خطا در بارگذاری یادداشت‌ها.</div>'});
</script>
<script type="text/javascript">
  !function(){var i="Rtij2E",d=document,g=d.createElement("script"),s="https://www.goftino.com/widget/"+i,l=localStorage.getItem("goftino_"+i);g.type="text/javascript",g.async=!0,g.src=l?s+"?o="+l:s;d.getElementsByTagName("head")[0].appendChild(g);}();
</script>
</body>
</html>
